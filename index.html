    let sortOrder = null;
    const list = document.getElementById("courseList");
    const template = document.getElementById("course-row-template");
    const sortIndicator = document.getElementById("sortIndicator");

    function notaStyles(nota) {
      return nota >= 0
        ? ["bg-emerald-50", "text-emerald-700", "border-emerald-200"]
        : ["bg-rose-50", "text-rose-700", "border-rose-200"];
    }

    function renderCourses(records) {
      list.replaceChildren();

      records.forEach((item, index) => {
        const fragment = template.content.cloneNode(true);
        const row = fragment.querySelector("article");
        const [background, color, border] = notaStyles(item.nota);

        row.style.animationDelay = `${Math.min(index * 0.012, 0.45)}s`;
        row.querySelector(".course-number").textContent = `${index + 1}.`;
        row.querySelector(".course-name").textContent = item.curso;
        row.querySelector(".campus-value").textContent = item.campus;
        row.querySelector(".shift-value").textContent = item.turno;

        const score = row.querySelector(".score-pill");
        score.classList.add(background, color, border);
        score.textContent = item.nota.toFixed(3);

        list.appendChild(fragment);
      });

      lucide.createIcons();
    }

    function toggleSort() {
      let ordered;

      if (sortOrder === null || sortOrder === "asc") {
        sortOrder = "desc";
        ordered = [...dados].sort((a, b) => b.nota - a.nota);
        sortIndicator.textContent = "▼ Maior nota para menor nota";
      } else {
        sortOrder = "asc";
        ordered = [...dados].sort((a, b) => a.nota - b.nota);
        sortIndicator.textContent = "▲ Menor nota para maior nota";
      }

      renderCourses(ordered);
    }

    document.getElementById("sortBtn").addEventListener("click", toggleSort);

    document.addEventListener("DOMContentLoaded", () => {
      renderCourses(dados);
      lucide.createIcons();
    });
